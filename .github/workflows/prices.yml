name: Precios y CCL
on:
  schedule:
    - cron: "20 14 * * 1-5"
    - cron: "20 20 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py prices
      - name: Guardar resultados
        run: |
          git config user.name "amd-investments-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/
          git diff --cached --quiet || git commit -m "datos prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours || true
          git push
      - name: Historial de precios para los gráficos
        continue-on-error: true
        run: python build.py hist
      - name: Publicar historial en la rama hist (sin acumular versiones)
        continue-on-error: true
        run: |
          cd out/hist
          git init -q
          git checkout -q -b hist
          git add .
          git -c user.name="amd-investments-bot" -c user.email="actions@users.noreply.github.com" commit -qm "historial $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hist
