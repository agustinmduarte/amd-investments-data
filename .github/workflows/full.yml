name: Balances, estimaciones y noticias
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py full
      - name: Guardar resultados
        run: |
          git config user.name "amd-investments-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/
          git diff --cached --quiet || git commit -m "datos full $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -X ours || true
          git push
